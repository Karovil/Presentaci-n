<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXPIA · Exposure & Intelligence Platform</title>
  <meta name="description" content="Experiencia interactiva de inteligencia de exposición.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/story.css">
</head>
<body>
  <!-- Mundo: el mapa vivo de la organización (un solo lienzo persistente) -->
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="annos" aria-hidden="true"></div>
  <div class="probe" role="status"></div>
  <div class="say" aria-live="polite"><p class="say__t"></p><p class="say__s"></p></div>

  <!-- HUD cartográfico -->
  <div class="frame" aria-hidden="true">
    <i class="frame__c tl"></i><i class="frame__c tr"></i><i class="frame__c bl"></i><i class="frame__c br"></i>
    <div class="ruler ruler--x"></div>
    <div class="ruler ruler--y"></div>
  </div>

  <header class="topbar">
    <div class="topbar__brand"><b>EXPIA</b><span>/</span><span>Inteligencia de exposición</span></div>
    <div class="topbar__scene"><b data-code>01</b><span data-name>Activación</span></div>
    <div class="topbar__live"><i></i><span data-clock>--:--:--</span></div>
  </header>

  <nav class="depth" aria-label="Escenas"></nav>

  <div class="instruments" aria-hidden="true">
    <div><span>Capa</span><b data-layer>Plataforma</b></div>
    <div><span>Escala</span><b data-scale>1:1.000</b></div>
    <div><span>Coord</span><b data-coords>+0000 · +0000</b></div>
  </div>

  <div class="caption is-empty"><p class="caption__k"></p><p class="caption__t"></p></div>

  <button class="hint" type="button" aria-label="Continuar">
    <span data-hint>Desplaza para profundizar</span>
    <i class="hint__chev"></i>
  </button>

  <main id="stage">

    <!-- 01 · ACTIVACIÓN -->
    <section class="scene scene--boot" data-id="boot">
      <div class="wordmark">
        <h1 class="wordmark__name" aria-label="EXPIA"></h1>
        <p class="wordmark__sub"></p>
        <p class="boot-status"></p>
      </div>
      <button class="activate" type="button">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="activate__track" cx="60" cy="60" r="46"/>
          <circle class="activate__fill" cx="60" cy="60" r="46"/>
          <g class="activate__ticks">
            <path d="M60 4v8M60 108v8M4 60h8M108 60h8"/>
          </g>
          <circle class="activate__core" cx="60" cy="60" r="5"/>
        </svg>
        <span class="activate__label"></span>
        <span class="activate__hint"></span>
      </button>
    </section>

    <!-- 02 · EL MAPA DE LA ORGANIZACIÓN -->
    <section class="scene scene--map" data-id="map">
      <div class="surface">
        <p class="surface__k"></p>
        <p class="surface__big"><span class="surface__n">0</span><span class="surface__u"></span></p>
        <p class="surface__line"></p>
      </div>
    </section>

    <!-- 03 · UNA VULNERABILIDAD -->
    <section class="scene scene--vuln" data-id="vuln">
      <div class="ask">
        <p class="ask__q"></p>
        <p class="ask__s"></p>
      </div>
    </section>

    <!-- 04 · LA SEÑAL Y SU CONTEXTO -->
    <section class="scene scene--context" data-id="context">
      <div class="sources"></div>
    </section>

  </main>

  <!-- Datos → núcleo → grafo → escenas → controlador -->
  <script src="js/data/narrative.js"></script>
  <script src="js/data/org.js"></script>
  <script src="js/data/story.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/graph/world.js"></script>
  <script src="js/graph/org-map.js"></script>
  <script src="js/graph/anno.js"></script>
  <script src="js/graph/case.js"></script>
  <script src="js/core/hud.js"></script>
  <script src="js/graph/kit.js"></script>
  <script src="js/graph/core.js"></script>
  <script src="js/graph/agents.js"></script>
  <script src="js/graph/pipeline.js"></script>
  <script src="js/graph/team.js"></script>
  <script src="js/scenes/01-boot.js"></script>
  <script src="js/scenes/02-map.js"></script>
  <script src="js/scenes/03-vuln.js"></script>
  <script src="js/scenes/04-context.js"></script>
  <!-- Bloque 1 · fragmentación -->
  <script src="js/scenes/05-sources.js"></script>
  <script src="js/scenes/06-grow.js"></script>
  <script src="js/scenes/07-alive.js"></script>
  <script src="js/scenes/08-volume.js"></script>
  <script src="js/scenes/09-intake.js"></script>
  <!-- Bloque 2 · automatización -->
  <script src="js/scenes/10-engine.js"></script>
  <script src="js/scenes/11-code.js"></script>
  <script src="js/scenes/12-specialists.js"></script>
  <!-- Bloque 3 · multi-agente -->
  <script src="js/scenes/13-agents.js"></script>
  <script src="js/scenes/14-argus.js"></script>
  <script src="js/scenes/15-agora.js"></script>
  <script src="js/scenes/16-aegis.js"></script>
  <script src="js/scenes/17-more.js"></script>
  <script src="js/scenes/18-delegate.js"></script>
  <script src="js/scenes/19-collab.js"></script>
  <script src="js/core/controller.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
